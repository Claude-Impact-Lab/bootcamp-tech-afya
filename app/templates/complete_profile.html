<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Complete seu cadastro</title><link rel="stylesheet" href="/static/styles.css" /><script src="/static/theme.js" defer></script></head>
<body><div class="center-shell"><main class="medium"><header class="site-header"><a class="brand" href="/"><span class="brand-mark">+</span><span>Portal de acessos</span></a><button class="theme-toggle" type="button" data-theme-toggle>Tema escuro</button></header><section class="card">
  <a class="back-link" href="/">← Voltar para o início</a><span class="eyebrow">ÚLTIMA ETAPA</span><h1>Complete seu cadastro</h1><p class="notice success"><strong>✓ Seu CRM foi validado.</strong><br />Agora precisamos confirmar a conclusão do seu perfil.</p><p class="lead">Especialidade, RQE, telefone, foto e outros dados profissionais poderão ser acrescentados futuramente.</p><div class="actions"><button id="complete">Concluir cadastro</button></div><p id="error" class="message" role="alert" hidden></p>
</section></main></div><script>document.getElementById("complete").addEventListener("click",async()=>{const error=document.getElementById("error");error.hidden=true;try{const response=await fetch("/doctor/complete-profile",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({confirmar:true})}),body=await response.json();if(!response.ok){error.textContent=body.detail||"Não foi possível concluir o cadastro.";error.hidden=false;return}window.location.assign(body.redirect_url)}catch(_){error.textContent="Não foi possível conectar ao servidor. Tente novamente.";error.hidden=false}});</script></body></html>
