<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Complete seu cadastro</title>
    <style>
      body{min-height:100vh;margin:0;padding:1rem;display:grid;place-items:center;background:#07111f;color:#f8fafc;font-family:system-ui,sans-serif}
      .card{width:min(42rem,100%);padding:2.5rem;border:1px solid #284058;border-radius:1rem;background:#122236}
      p,a{color:#a9b8c8;line-height:1.6}.notice{padding:1rem;border-radius:.6rem;background:#0f302e;color:#b9fff9}
      button{padding:.85rem 1.2rem;border:0;border-radius:.6rem;background:#18a8a3;color:white;font-weight:800;cursor:pointer}
      .actions{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}.error{color:#fecdd3}[hidden]{display:none!important}
    </style>
  </head>
  <body>
    <main class="card">
      <a href="/">← Voltar para o início</a>
      <h1>Complete seu cadastro</h1>
      <p class="notice">Seu CRM foi validado. Agora precisamos de algumas informações para concluir seu perfil.</p>
      <p>Nesta primeira versão, confirme a conclusão desta etapa. Especialidade, RQE, telefone, foto e dados profissionais poderão ser acrescentados aqui futuramente.</p>
      <div class="actions"><button id="complete">Concluir cadastro</button></div>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
    <script>
      document.getElementById("complete").addEventListener("click", async () => {
        const error = document.getElementById("error");
        error.hidden = true;
        try {
          const response = await fetch("/doctor/complete-profile", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({confirmar:true}),
          });
          const body = await response.json();
          if (!response.ok) {
            error.textContent = body.detail || "Não foi possível concluir o cadastro.";
            error.hidden = false;
            return;
          }
          window.location.assign(body.redirect_url);
        } catch (_) {
          error.textContent = "Não foi possível conectar ao servidor. Tente novamente.";
          error.hidden = false;
        }
      });
    </script>
  </body>
</html>
