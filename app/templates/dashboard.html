<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Painel</title><link rel="stylesheet" href="/static/styles.css" /><script src="/static/theme.js" defer></script></head>
<body><div class="center-shell"><main class="medium"><header class="site-header"><a class="brand" href="/"><span class="brand-mark">+</span><span>Portal de acessos</span></a><button class="theme-toggle" type="button" data-theme-toggle>Tema escuro</button></header><section class="card">
  <span class="badge success">✓ Conta ativa</span><h1 style="margin-top:.9rem">Olá, {{ user.nome }}</h1>{% if kind == "doctor" %}<p class="lead">Este é o seu painel médico. Seu CRM foi validado com os dados públicos do CFM.</p>{% else %}<p class="lead">Este é seu painel de usuário. Seu acesso não utiliza CRM e possui permissões próprias.</p>{% endif %}<div class="actions"><a href="/">← Voltar para o início</a><button id="logout">Sair</button></div>
</section></main></div><script>document.getElementById("logout").addEventListener("click",async()=>{await fetch("/account/logout",{method:"POST"});window.location.assign({{ ('/doctor/login' if kind == 'doctor' else '/non-medical/login') | tojson }})});</script></body></html>
