<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Painel</title><style>body{min-height:100vh;margin:0;padding:1rem;display:grid;place-items:center;background:#07111f;color:#f8fafc;font-family:system-ui,sans-serif}.card{width:min(48rem,100%);padding:2.5rem;border:1px solid #284058;border-radius:1rem;background:#122236}p{color:#a9b8c8}button{padding:.75rem 1rem;border:0;border-radius:.6rem;background:#18a8a3;color:white;font-weight:800;cursor:pointer}.badge{display:inline-block;padding:.35rem .7rem;border-radius:2rem;background:#0f302e;color:#b9fff9}</style></head><body><main class="card"><span class="badge">Conta ativa</span><h1>Olá, {{ user.nome }}</h1>{% if kind == "doctor" %}<p>Este é o seu painel médico. Seu CRM foi aprovado manualmente pelo administrador.</p>{% else %}<p>Este é seu painel de usuário. Seu acesso não utiliza CRM e possui permissões próprias.</p>{% endif %}<button id="logout">Sair</button></main><script>document.getElementById("logout").addEventListener("click",async()=>{await fetch("/account/logout",{method:"POST"});window.location.assign({{ ('/doctor/login' if kind == 'doctor' else '/non-medical/login') | tojson }});});</script></body></html>
