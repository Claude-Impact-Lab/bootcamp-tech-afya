<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Cadastro de usuário</title><link rel="stylesheet" href="/static/styles.css" /><script src="/static/theme.js" defer></script></head>
<body><div class="center-shell"><main class="narrow"><header class="site-header"><a class="brand" href="/"><span class="brand-mark">+</span><span>Portal de acessos</span></a><button class="theme-toggle" type="button" data-theme-toggle>Tema escuro</button></header><section class="card">
  <span class="eyebrow">CADASTRO SEM CRM</span><h1>Acesso para não médicos</h1><p class="lead">Crie sua conta. O administrador analisará a solicitação antes de liberar seu painel.</p>
  <form id="register-form" class="form-stack"><label>Nome completo<input id="name" required minlength="2" autocomplete="name" /></label><label>E-mail<input id="email" type="email" required autocomplete="email" /></label><label>Senha<input id="password" type="password" required minlength="8" autocomplete="new-password" /></label><label>Confirme a senha<input id="confirmation" type="password" required minlength="8" autocomplete="new-password" /></label><button type="submit">Enviar pré-cadastro</button></form>
  <p id="message" class="message success" role="status" hidden></p><nav style="margin-top:1.4rem"><a href="/">← Voltar para o início</a><a href="/non-medical/login">Já tenho cadastro</a><a href="/">Sou médico</a></nav>
</section></main></div>
<script>const form=document.getElementById("register-form"),message=document.getElementById("message");function detail(body,response){if(typeof body?.detail==="string")return body.detail;if(Array.isArray(body?.detail))return body.detail.map(item=>String(item.msg).replace("Value error, ","")).join("; ");return`Não foi possível concluir (${response.status}).`}form.addEventListener("submit",async event=>{event.preventDefault();message.hidden=true;message.classList.remove("error");try{const response=await fetch("/non-medical/registrations",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:{nome:document.getElementById("name").value,email:document.getElementById("email").value},senha:document.getElementById("password").value,confirmacao_senha:document.getElementById("confirmation").value})}),body=await response.json();if(!response.ok){message.textContent=detail(body,response);message.classList.remove("success")}else{form.reset();message.textContent="Cadastro realizado. Seus dados estão aguardando validação."}}catch(_){message.textContent="Não foi possível conectar ao servidor. Tente novamente.";message.classList.remove("success")}message.hidden=false});</script></body></html>
