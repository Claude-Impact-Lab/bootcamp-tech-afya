<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Recuperar senha</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="/static/theme.js" defer></script>
</head>
<body><div class="center-shell"><main class="narrow">
  <header class="site-header"><a class="brand" href="/"><span class="brand-mark">+</span><span>Portal de acessos</span></a><button class="theme-toggle" type="button" data-theme-toggle>Tema escuro</button></header>
  <section class="card">
    <a class="back-link" href="/doctor/login">← Voltar para o login</a>
    <span class="eyebrow">RECUPERAÇÃO DE ACESSO</span><h1>Esqueci minha senha</h1>
    <p class="lead">Informe seu e-mail para receber um link temporário de recuperação.</p>
    <form id="forgot-form" class="form-stack"><label>E-mail<input id="forgot-email" type="email" required autocomplete="email" /></label><button type="submit">Gerar link de recuperação</button></form>
    <p id="forgot-message" class="message success" role="status" hidden></p>
    <p id="local-link" class="notice" hidden>Ambiente de ensino: <a id="reset-link" href="#">abrir link de recuperação</a>.</p>
    <nav style="margin-top:1.25rem"><a href="/">← Voltar para o início</a></nav>
  </section>
</main></div>
<script>
  const form=document.getElementById("forgot-form"),message=document.getElementById("forgot-message"),local=document.getElementById("local-link"),link=document.getElementById("reset-link");
  form.addEventListener("submit",async event=>{event.preventDefault();message.hidden=true;local.hidden=true;const button=form.querySelector("button");button.disabled=true;try{const response=await fetch("/account/password-reset/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("forgot-email").value})}),body=await response.json();if(!response.ok)throw new Error(body.detail||"Não foi possível gerar o link.");message.textContent=body.message;message.hidden=false;if(body.reset_url){link.href=body.reset_url;local.hidden=false}}catch(reason){message.textContent=reason.message;message.className="message";message.hidden=false}finally{button.disabled=false}});
</script></body></html>
