<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro profissional</title>
    <style>
      :root {
        --background: #121214;
        --card: #202024;
        --input: #121214;
        --border: #323238;
        --text: #e1e1e6;
        --muted: #a8a8b3;
        --blue: #2563eb;
        --blue-hover: #1d4ed8;
        --success-bg: #153226;
        --success-border: #287a55;
        --success-text: #bbf7d0;
        --danger-bg: #3a1f25;
        --danger-border: #7f1d2d;
        --danger-text: #fecdd3;
      }

      body.tema-claro {
        --background: #f4f4f5;
        --card: #ffffff;
        --input: #ffffff;
        --border: #d4d4d8;
        --text: #27272a;
        --muted: #52525b;
        --success-bg: #f0fdf4;
        --success-border: #86efac;
        --success-text: #166534;
        --danger-bg: #fff1f2;
        --danger-border: #fda4af;
        --danger-text: #9f1239;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 2rem 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main { position: relative; width: 100%; max-width: 52rem; text-align: center; }
      h1 { margin: 0; font-size: clamp(2rem, 5vw, 2.75rem); }
      h2 { margin: .5rem 0 2rem; color: var(--muted); font-size: 1.1rem; font-weight: 400; }

      .card {
        padding: 1.5rem;
        border: 1px solid var(--border);
        border-radius: .75rem;
        background: var(--card);
        box-shadow: 0 .75rem 2rem rgba(0, 0, 0, .25);
        text-align: left;
      }

      form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 1rem; align-items: end; }
      label { display: flex; flex-direction: column; gap: .45rem; font-size: .9rem; font-weight: 600; }

      input {
        width: 100%;
        padding: .75rem;
        border: 1px solid var(--border);
        border-radius: .5rem;
        outline: none;
        background: var(--input);
        color: var(--text);
        font: inherit;
        transition: border-color .2s, box-shadow .2s;
      }

      input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, .25); }

      button {
        padding: .75rem 1.25rem;
        border: 0;
        border-radius: .5rem;
        background: var(--blue);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        transition: background .2s, transform .2s;
      }

      button:hover { background: var(--blue-hover); transform: translateY(-1px); }
      button:disabled { cursor: progress; opacity: .65; }

      #botao-tema {
        position: absolute;
        top: 0;
        right: 0;
        padding: .4rem .6rem;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font-size: .65rem;
      }

      #resultado {
        margin: 1rem 0 0;
        padding: .75rem 1rem;
        border: 1px solid var(--success-border);
        border-radius: .5rem;
        background: var(--success-bg);
        color: var(--success-text);
      }

      #resultado.erro {
        border-color: var(--danger-border);
        background: var(--danger-bg);
        color: var(--danger-text);
      }

      .admin-link { display: inline-block; margin-top: 1.25rem; color: var(--muted); font-size: .85rem; }
      [hidden] { display: none !important; }

      @media (max-width: 640px) {
        body { align-items: flex-start; }
        main { padding-top: 2.5rem; }
        form { grid-template-columns: 1fr; }
        form button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Portal médico</h1>
      <h2>Cadastre seus dados de acesso profissional.</h2>
      <button id="botao-tema" type="button">TEMA CLARO/ESCURO</button>

      <section class="card">
        <form id="form-novo" novalidate>
          <label>Nome completo<input id="campo-nome" name="nome" required minlength="2" /></label>
          <label>E-mail profissional<input id="campo-email" name="email" type="email" required /></label>
          <button id="botao-salvar" type="submit">Enviar cadastro</button>
        </form>
        <p id="resultado" role="status" hidden></p>
      </section>

      <a class="admin-link" href="/admin">Acesso administrativo</a>
    </main>

    <script>
      const form = document.getElementById("form-novo");
      const campoNome = document.getElementById("campo-nome");
      const campoEmail = document.getElementById("campo-email");
      const botaoSalvar = document.getElementById("botao-salvar");
      const botaoTema = document.getElementById("botao-tema");
      const resultado = document.getElementById("resultado");

      function aplicarTema(tema) {
        document.body.classList.toggle("tema-claro", tema === "claro");
      }

      aplicarTema(localStorage.getItem("tema") || "escuro");
      botaoTema.addEventListener("click", () => {
        const tema = document.body.classList.contains("tema-claro") ? "escuro" : "claro";
        aplicarTema(tema);
        localStorage.setItem("tema", tema);
      });

      function mensagemDeErro(corpo, resposta) {
        if (typeof corpo?.detail === "string") return corpo.detail;
        if (Array.isArray(corpo?.detail)) {
          return corpo.detail
            .map((erro) => String(erro.msg || "Dados inválidos").replace("Value error, ", ""))
            .join("; ");
        }
        return `A API respondeu ${resposta.status}.`;
      }

      form.addEventListener("submit", (evento) => {
        evento.preventDefault();
        resultado.hidden = true;
        resultado.classList.remove("erro");
        botaoSalvar.disabled = true;

        fetch("/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nome: campoNome.value, email: campoEmail.value }),
        })
          .then((resposta) => resposta.json().then((corpo) => {
            if (!resposta.ok) throw new Error(mensagemDeErro(corpo, resposta));
            return corpo;
          }))
          .then(() => {
            form.reset();
            resultado.textContent = "Cadastro realizado com sucesso.";
            resultado.hidden = false;
            campoNome.focus();
          })
          .catch((erro) => {
            resultado.textContent = erro.message;
            resultado.classList.add("erro");
            resultado.hidden = false;
          })
          .finally(() => { botaoSalvar.disabled = false; });
      });
    </script>
  </body>
</html>
