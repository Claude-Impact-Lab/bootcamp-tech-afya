<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Manager</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .caixa {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 8px 16px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Usuarios</h1>
      <p id="total" class="caixa">...</p>
      <!-- A lista nasce vazia: o HTML nao sabe quantos usuarios existem.
           Quem cria os <li> e o JavaScript, com o que a API respondeu. -->
      <ul id="usuarios"></ul>
      <p id="aviso">carregando...</p>

      <div id="caixa-pre-cadastro" class="caixa">
        <strong>Em pre-cadastro</strong>
        <ul id="pendentes"></ul>
      </div>
    </main>

    <script>
      const lista = document.getElementById("usuarios");
      const aviso = document.getElementById("aviso");
      const total = document.getElementById("total");
      const pendentes = document.getElementById("pendentes");
      const caixaPreCadastro = document.getElementById("caixa-pre-cadastro");

      fetch("/users")
        .then((resposta) => resposta.json())
        .then((usuarios) => {
          usuarios.forEach((usuario) => {
            const item = document.createElement("li");
            item.textContent = usuario.name;
            lista.appendChild(item);
          });

          // A contagem sai do tamanho da lista que a API mandou -- nao precisa
          // de outra rota so para isso.
          const quantidade = usuarios.length;
          total.textContent =
            quantidade === 1 ? "1 usuario cadastrado" : `${quantidade} usuarios cadastrados`;

          // Lista vazia nao e erro: a API respondeu certo, so nao ha ninguem.
          aviso.textContent = quantidade ? "" : "nenhum usuario cadastrado";

          // Filtra a mesma lista que ja chegou, sem pedir nada novo para a API.
          const emPreCadastro = usuarios.filter(
            (usuario) => usuario.status === "pre_cadastro"
          );

          emPreCadastro.forEach((usuario) => {
            const item = document.createElement("li");
            item.textContent = usuario.name;
            pendentes.appendChild(item);
          });

          if (emPreCadastro.length === 0) {
            const item = document.createElement("li");
            item.textContent = "ninguem em pre-cadastro";
            pendentes.appendChild(item);
          }
        })
        .catch(() => {
          total.textContent = "";
          caixaPreCadastro.hidden = true;
          aviso.textContent = "erro ao chamar a API";
        });
    </script>
  </body>
</html>
