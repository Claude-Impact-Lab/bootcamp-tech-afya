<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Manager</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Usuarios</h1>
      <!-- A lista nasce vazia: o HTML nao sabe quantos usuarios existem.
           Quem cria os <li> e o JavaScript, com o que a API respondeu. -->
      <ul id="usuarios"></ul>
      <p id="aviso">carregando...</p>
    </main>

    <script>
      const lista = document.getElementById("usuarios");
      const aviso = document.getElementById("aviso");

      fetch("/users")
        .then((resposta) => resposta.json())
        .then((usuarios) => {
          usuarios.forEach((usuario) => {
            const item = document.createElement("li");
            item.textContent = usuario.name;
            lista.appendChild(item);
          });

          // Lista vazia nao e erro: a API respondeu certo, so nao ha ninguem.
          aviso.textContent = usuarios.length ? "" : "nenhum usuario cadastrado";
        })
        .catch(() => {
          aviso.textContent = "erro ao chamar a API";
        });
    </script>
  </body>
</html>
