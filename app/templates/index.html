<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Manager</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Usuários</h1>
      <p id="aviso">carregando...</p>
      <ul id="usuarios"></ul>
    </main>

    <script>
      const aviso = document.getElementById("aviso");
      const lista = document.getElementById("usuarios");

      // Busca os dados na API em vez de escrever no HTML:
      // e o primeiro contato do time com fetch + JSON.
      fetch("/users")
        .then((resposta) => resposta.json())
        .then((usuarios) => {
          // Lista vazia nao e erro: e sucesso com zero itens.
          aviso.textContent =
            usuarios.length === 0 ? "nenhum usuário cadastrado ainda" : "";

          // O HTML nao sabe de antemao quantos usuarios existem,
          // entao cada <li> nasce aqui, a partir da resposta da API.
          usuarios.forEach((usuario) => {
            const item = document.createElement("li");
            item.textContent = `${usuario.id} — ${usuario.name}`;
            lista.appendChild(item);
          });
        })
        .catch(() => {
          aviso.textContent = "erro ao chamar a API";
        });
    </script>
  </body>
</html>
