<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Manager</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: grid;
        place-items: center;
        min-height: 100vh;
        color: #333;
      }

      .container {
        text-align: center;
        background: white;
        padding: 3rem 2rem;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        max-width: 400px;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        color: #667eea;
      }

      #mensagem {
        font-size: 1.25rem;
        min-height: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .loading {
        color: #999;
        font-style: italic;
      }

      .error {
        color: #e74c3c;
      }

      .success {
        color: #27ae60;
        font-weight: bold;
      }

      form,
      #usuarios {
        display: grid;
        gap: 0.75rem;
        margin-top: 1.5rem;
        text-align: left;
      }

      input,
      button {
        padding: 0.65rem;
        border: 1px solid #ddd;
        border-radius: 4px;
      }

      button {
        cursor: pointer;
        background: #667eea;
        color: white;
        border: 0;
      }

      .doctor-fields {
        display: none;
        gap: 0.75rem;
      }

      .doctor-fields.visible {
        display: grid;
      }

      .usuario {
        padding: 0.75rem;
        border: 1px solid #eee;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>User Manager</h1>
      <p id="mensagem" class="loading">Carregando...</p>

      <form id="user-form">
        <input id="name" name="name" placeholder="Nome" required />
        <input id="email" name="email" type="email" placeholder="Email" required />
        <label>
          <input id="is-doctor" name="is-doctor" type="checkbox" />
          Usuário médico
        </label>
        <div id="doctor-fields" class="doctor-fields">
          <input id="crm" name="crm" placeholder="CRM" />
          <input id="uf" name="uf" maxlength="2" placeholder="UF" />
        </div>
        <button type="submit">Cadastrar usuário</button>
      </form>

      <div id="usuarios"></div>
    </div>

    <script>
      /**
       * Busca a mensagem da API em /health e exibe na página.
       * 
       * Este é o primeiro contato do time com:
       * - fetch() para fazer requisições HTTP
       * - JSON como formato de dados
       * - manipulação do DOM (document.getElementById, textContent)
       * - tratamento de erros com .catch()
       */
      const doctorCheckbox = document.getElementById("is-doctor");
      const doctorFields = document.getElementById("doctor-fields");

      doctorCheckbox.addEventListener("change", () => {
        doctorFields.classList.toggle("visible", doctorCheckbox.checked);
      });

      function carregarUsuarios() {
        return fetch("/users")
          .then((resposta) => {
            if (!resposta.ok) {
              throw new Error(`Erro HTTP: ${resposta.status}`);
            }
            return resposta.json();
          })
          .then((usuarios) => {
            document.getElementById("usuarios").innerHTML = usuarios
              .map((usuario) => {
                const tipo = usuario.is_doctor
                  ? `Médico: CRM ${usuario.doctor.crm}/${usuario.doctor.uf}`
                  : "Usuário comum";
                return `<div class="usuario"><strong>${usuario.name}</strong><br />${usuario.email}<br />${tipo}</div>`;
              })
              .join("");
          });
      }

      document.getElementById("user-form").addEventListener("submit", (evento) => {
        evento.preventDefault();
        const isDoctor = doctorCheckbox.checked;
        const payload = {
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          is_doctor: isDoctor,
        };
        if (isDoctor) {
          payload.crm = document.getElementById("crm").value;
          payload.uf = document.getElementById("uf").value;
        }

        fetch("/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        })
          .then((resposta) => {
            if (!resposta.ok) {
              throw new Error(`Erro HTTP: ${resposta.status}`);
            }
            return resposta.json();
          })
          .then(() => {
            evento.target.reset();
            doctorFields.classList.remove("visible");
            return carregarUsuarios();
          })
          .catch((erro) => {
            document.getElementById("mensagem").textContent = erro.message;
            document.getElementById("mensagem").className = "error";
          });
      });

      fetch("/health")
        .then((resposta) => {
          // Verifica se a resposta HTTP foi bem-sucedida (status 200)
          if (!resposta.ok) {
            throw new Error(`Erro HTTP: ${resposta.status}`);
          }
          // Converte a resposta para JSON
          return resposta.json();
        })
        .then((dados) => {
          // Atualiza o elemento HTML com a mensagem recebida
          const elemento = document.getElementById("mensagem");
          elemento.textContent = dados.message;
          elemento.className = "success";
        })
        .catch((erro) => {
          // Se algo der errado, exibe mensagem de erro
          console.error("Erro ao chamar a API:", erro);
          const elemento = document.getElementById("mensagem");
          elemento.textContent = "Erro ao chamar a API";
          elemento.className = "error";
        });

      carregarUsuarios().catch((erro) => {
        document.getElementById("mensagem").textContent = erro.message;
        document.getElementById("mensagem").className = "error";
      });
    </script>
  </body>
</html>
