<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Manager - Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0033CC 0%, #1B4DCF 25%, #D81B60 75%, #FF1744 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Efeito de linhas no fundo */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.03) 50%, transparent 100%),
                linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.05) 50%, transparent 100%);
            pointer-events: none;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            gap: 2rem;
            padding: 2rem;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .left-section {
            flex: 1;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: slideInLeft 0.8s ease-out;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .left-section h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .left-section p {
            font-size: 1.3rem;
            font-weight: 300;
            line-height: 1.6;
            opacity: 0.95;
        }

        .center-card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            animation: slideInUp 0.8s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #D81B60;
            letter-spacing: -0.5px;
        }

        .logo-text {
            font-size: 0.75rem;
            color: #999;
            font-weight: 500;
            margin-top: 0.25rem;
        }

        .back-link {
            background: none;
            border: 2px solid #0033CC;
            color: #0033CC;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: #0033CC;
            color: white;
        }

        .card-title {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #0033CC;
            box-shadow: 0 0 0 3px rgba(0, 51, 204, 0.1);
        }

        input::placeholder {
            color: #999;
        }

        .submit-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #0033CC 0%, #1B4DCF 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 51, 204, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .message.info {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #bbdefb;
        }

        .users-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #f0f0f0;
        }

        .users-title {
            font-size: 1rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 1rem;
        }

        .users-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
        }

        .user-item {
            padding: 0.75rem;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            border-left: 3px solid #D81B60;
            transition: all 0.2s ease;
        }

        .user-item:hover {
            background: #f0f0f0;
            transform: translateX(4px);
        }

        .user-name {
            font-weight: 600;
            color: #333;
        }

        .user-email {
            color: #999;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 1rem 0;
            font-size: 0.9rem;
        }

        .right-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: slideInRight 0.8s ease-out;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .illustration {
            width: 100%;
            max-width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .illustration::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }

        .illustration svg {
            width: 80%;
            height: 80%;
            z-index: 1;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 1rem;
            text-align: center;
            font-size: 0.85rem;
        }

        footer a {
            color: white;
            text-decoration: none;
            margin: 0 1rem;
            transition: all 0.3s ease;
        }

        footer a:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 1rem;
            }

            .left-section {
                text-align: center;
                margin-top: 2rem;
            }

            .left-section h1 {
                font-size: 2rem;
            }

            .left-section p {
                font-size: 1.1rem;
            }

            .right-section {
                display: none;
            }

            footer {
                position: relative;
                margin-top: 2rem;
            }

            .center-card {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <h1>Bem vindo!</h1>
            <p>Aqui você poderá gerenciar seu acesso <strong>institucional</strong>.</p>
        </div>

        <div class="center-card">
            <div class="logo-header">
                <div>
                    <div class="logo">Afya</div>
                    <div class="logo-text">Educação Médica</div>
                </div>
                <button class="back-link" onclick="window.history.back()">← Voltar</button>
            </div>

            <div class="card-title">Confirme seus dados para continuar:</div>

            <form id="login-form">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input 
                        type="text" 
                        id="nome" 
                        name="nome" 
                        placeholder="Digite seu nome" 
                        required 
                    />
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="seu.email@exemplo.com" 
                        required 
                    />
                </div>

                <button type="submit" class="submit-btn">Confirmar →</button>
                <p id="mensagem"></p>
            </form>

            <div class="users-section">
                <div class="users-title">Usuários cadastrados</div>
                <p id="aviso" class="empty-state">carregando...</p>
                <ul id="lista" class="users-list"></ul>
            </div>
        </div>

        <div class="right-section">
            <div class="illustration">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Cabeça -->
                    <circle cx="100" cy="60" r="30" fill="#FFD6E8" opacity="0.8"/>
                    <!-- Cabelo -->
                    <path d="M 70 50 Q 100 20 130 50" fill="#FF69B4" opacity="0.8"/>
                    <!-- Corpo -->
                    <rect x="80" y="90" width="40" height="60" rx="8" fill="#E91E63" opacity="0.7"/>
                    <!-- Braço esquerdo -->
                    <rect x="50" y="95" width="30" height="12" rx="6" fill="#FFD6E8" opacity="0.8" transform="rotate(-30 65 101)"/>
                    <!-- Braço direito com tablet -->
                    <rect x="120" y="95" width="30" height="12" rx="6" fill="#FFD6E8" opacity="0.8" transform="rotate(30 135 101)"/>
                    <!-- Tablet/Dispositivo -->
                    <rect x="130" y="85" width="35" height="50" rx="4" fill="#0033CC" opacity="0.6" transform="rotate(25 147.5 110)"/>
                    <!-- Holograma/Círculos -->
                    <circle cx="100" cy="100" r="50" fill="none" stroke="white" stroke-width="1" opacity="0.3" stroke-dasharray="5,5"/>
                    <circle cx="100" cy="100" r="65" fill="none" stroke="white" stroke-width="0.5" opacity="0.2" stroke-dasharray="8,4"/>
                    <!-- Pernas -->
                    <line x1="90" y1="150" x2="85" y2="180" stroke="#FFD6E8" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
                    <line x1="110" y1="150" x2="115" y2="180" stroke="#FFD6E8" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
                </svg>
            </div>
        </div>
    </div>

    <footer>
        <a href="#">Termos</a>
        <a href="#">Política de Privacidade</a>
        <span style="color: white; opacity: 0.7;">© 2026 Afya - Todos os direitos reservados</span>
    </footer>

    <script>
      const aviso = document.getElementById("aviso");
      const lista = document.getElementById("lista");
      const form = document.getElementById("login-form");
      const nomeInput = document.getElementById("nome");
      const emailInput = document.getElementById("email");
      const mensagem = document.getElementById("mensagem");

      // Esta funcao carrega os usuarios da API e atualiza a lista na tela.
      function carregarUsuarios() {
        aviso.textContent = "carregando...";
        aviso.className = "empty-state";
        lista.innerHTML = "";

        fetch("/users")
          .then((resposta) => resposta.json())
          .then((usuarios) => {
            if (usuarios.length === 0) {
              aviso.textContent = "nenhum usuário cadastrado ainda";
              aviso.className = "empty-state";
            } else {
              aviso.textContent = "";
            }

            usuarios.forEach((usuario) => {
              const item = document.createElement("li");
              item.className = "user-item";

              const nome = document.createElement("div");
              nome.className = "user-name";
              nome.textContent = usuario.nome;

              const email = document.createElement("div");
              email.className = "user-email";
              email.textContent = usuario.email;

              item.append(nome, email);
              lista.append(item);
            });
          })
          .catch((erro) => {
            aviso.textContent = "erro ao carregar usuários";
            aviso.className = "empty-state";
            console.error("Erro:", erro);
          });
      }

      // Quando o formulario e enviado, criamos um novo usuario via POST.
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        
        const submitBtn = form.querySelector(".submit-btn");
        const btnText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = "Processando...";
        
        mensagem.textContent = "Enviando...";
        mensagem.className = "message info";

        const novoUsuario = {
          nome: nomeInput.value.trim(),
          email: emailInput.value.trim(),
        };

        fetch("/users", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(novoUsuario),
        })
          .then((resposta) => {
            if (!resposta.ok) {
              throw new Error("Falha ao cadastrar usuário");
            }
            return resposta.json();
          })
          .then((usuarioCriado) => {
            mensagem.textContent = `✓ Usuário ${usuarioCriado.nome} cadastrado com sucesso!`;
            mensagem.className = "message success";
            nomeInput.value = "";
            emailInput.value = "";
            carregarUsuarios();
            
            // Limpar mensagem após 3 segundos
            setTimeout(() => {
              mensagem.textContent = "";
              mensagem.className = "";
            }, 3000);
          })
          .catch((erro) => {
            mensagem.textContent = "✗ Erro ao cadastrar usuário. Tente novamente.";
            mensagem.className = "message error";
            console.error("Erro:", erro);
          })
          .finally(() => {
            submitBtn.disabled = false;
            submitBtn.textContent = btnText;
          });
      });

      // Carregar usuários ao abrir a página
      carregarUsuarios();
    </script>
  </body>
</html>
