<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Manager</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0 auto;
        padding: 2rem 1rem;
        max-width: 40rem;
      }

      li {
        margin-bottom: 0.5rem;
      }

      .email {
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Usuarios</h1>

    <p id="aviso">carregando...</p>
    <ul id="lista"></ul>

    <script>
      const aviso = document.getElementById("aviso");
      const lista = document.getElementById("lista");

      // A tela nao sabe quantos usuarios existem: ela monta os <li> a
      // partir do que a API respondeu.
      fetch("/users")
        .then((resposta) => resposta.json())
        .then((usuarios) => {
          // Lista vazia nao e erro: e so uma lista sem itens.
          aviso.textContent = usuarios.length
            ? ""
            : "nenhum usuario cadastrado";

          usuarios.forEach((usuario) => {
            const item = document.createElement("li");

            const nome = document.createElement("strong");
            nome.textContent = usuario.nome;

            const email = document.createElement("span");
            email.className = "email";
            email.textContent = ` — ${usuario.email}`;

            item.append(nome, email);
            lista.append(item);
          });
        })
        .catch(() => {
          aviso.textContent = "erro ao chamar a API";
        });
    </script>
  </body>
</html>
