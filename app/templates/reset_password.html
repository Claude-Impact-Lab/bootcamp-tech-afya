<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Criar nova senha</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="/static/theme.js" defer></script>
</head>
<body><div class="center-shell"><main class="narrow">
  <header class="site-header"><a class="brand" href="/"><span class="brand-mark">+</span><span>Portal de acessos</span></a><button class="theme-toggle" type="button" data-theme-toggle>Tema escuro</button></header>
  <section class="card">
    <span class="eyebrow">RECUPERAÇÃO DE ACESSO</span><h1>Crie uma nova senha</h1>
    <p class="lead">Use pelo menos oito caracteres.</p>
    <form id="reset-form" class="form-stack"><label>Nova senha<input id="reset-password" type="password" required minlength="8" autocomplete="new-password" /></label><label>Confirme a nova senha<input id="reset-confirmation" type="password" required minlength="8" autocomplete="new-password" /></label><button type="submit">Atualizar senha</button></form>
    <p id="reset-message" class="message" role="alert" hidden></p>
    <nav style="margin-top:1.25rem"><a href="/">← Voltar para o início</a><a href="/doctor/login">Login médico</a><a href="/non-medical/login">Login sem CRM</a></nav>
  </section>
</main></div>
<script>
  const token={{ token | tojson }},form=document.getElementById("reset-form"),message=document.getElementById("reset-message");
  if(!token){message.textContent="O link de recuperação está incompleto.";message.hidden=false;form.hidden=true}
  form.addEventListener("submit",async event=>{event.preventDefault();message.hidden=true;const button=form.querySelector("button");button.disabled=true;try{const response=await fetch("/account/password-reset/confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,senha:document.getElementById("reset-password").value,confirmacao_senha:document.getElementById("reset-confirmation").value})}),body=await response.json();if(!response.ok){const detail=Array.isArray(body.detail)?body.detail.map(item=>item.msg).join("; "):body.detail;throw new Error(detail||"Não foi possível atualizar a senha.")}message.textContent=body.message;message.className="message success";message.hidden=false;setTimeout(()=>window.location.assign(body.redirect_url),800)}catch(reason){message.textContent=reason.message;message.className="message";message.hidden=false}finally{button.disabled=false}});
</script></body></html>
