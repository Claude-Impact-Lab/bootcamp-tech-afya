[project]
name = "usermanager"
version = "0.1.0"
description = "Treinamento de programacao - cadastro e validacao de medicos (CFM)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "sqlalchemy>=2.0.52",
    "psycopg[binary]>=3.3.4",
    "alembic>=1.19.1",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
